repos:
  - repo: local
    hooks:
      # Pre-commit hooks (fast - only affected packages)
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-build-affected
        name: cargo build (affected)
        entry: cargo affected --staged build
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy-affected
        name: cargo clippy (affected)
        entry: cargo affected --verbose --staged clippy --fix -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test-affected
        name: cargo test (affected)
        entry: cargo affected --staged test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-tarpaulin-affected
        name: cargo tarpaulin (affected)
        entry: cargo affected --staged tarpaulin --fail-under 90
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      # Pre-push hooks (full verification)
      - id: cargo-build-full
        name: cargo build (full)
        entry: cargo build
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-clippy-full
        name: cargo clippy (full)
        entry: cargo clippy --fix -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test-full
        name: cargo test (full)
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-tarpaulin-full
        name: cargo tarpaulin (full)
        entry: cargo tarpaulin --fail-under 90
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
