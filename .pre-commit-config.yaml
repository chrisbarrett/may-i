repos:
  - repo: local
    hooks:
      # Pre-commit hooks (fast - only affected packages)
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-build-affected
        name: cargo build (affected)
        entry: env RUSTFLAGS="-D warnings" cargo affected --staged build
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy-affected
        name: cargo clippy (affected)
        entry: cargo affected --verbose --staged clippy --fix --allow-dirty -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test-affected
        name: cargo tarpaulin (affected)
        entry: cargo affected --staged tarpaulin
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      # Pre-push hooks (full verification)
      - id: cargo-build-full
        name: cargo build (full)
        entry: env RUSTFLAGS="-D warnings" cargo build
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-clippy-full
        name: cargo clippy (full)
        entry: cargo clippy --fix --allow-dirty -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test-full
        name: cargo tarpaulin (full)
        entry: cargo tarpaulin
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
