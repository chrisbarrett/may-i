[default]
command = "Test"
run-types = ["Lib", "Tests", "Doctests"]
workspace = true
fail-under = 85
exclude-files = [
  "src/main.rs",
  "src/cmd_*.rs",
  "crates/config/src/io.rs",
  "crates/**/*_tests.rs",
  "crates/**/test_helpers.rs",
  "crates/core/src/arbitrary_impls.rs",
]

[report]
out = ["Html", "Stdout", "Lcov"]
