name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Cold cache: incremental state cannot survive between jobs.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # crates/core uses #![feature(coverage_attribute)], so the build
      # requires nightly; rust-toolchain.toml governs the exact channel.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

  # Script-level checks run through the flake's lightweight `scripts` dev shell,
  # so CI uses the same pinned tools as local development (and the prek hooks)
  # without building the Rust toolchain.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      # Output-boundary gate: no process stream handle (io::stdout/stderr,
      # console::Term::std*, raw fd) acquired outside the sink. Structural
      # ast-grep scan; see scripts/check-output-sink-boundary.sh.
      - name: Output sink boundary
        run: nix develop .#scripts --command scripts/check-output-sink-boundary.sh
