[package]
name = "may-i-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
may-i-core = { path = "../crates/core", features = ["arbitrary"] }
may-i-engine = { path = "../crates/engine" }

[[bin]]
name = "fuzz_evaluator"
path = "fuzz_targets/fuzz_evaluator.rs"
test = false
doc = false
bench = false
