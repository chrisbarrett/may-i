[lints]
workspace = true

[package]
name = "may-i-config"
version = "0.1.0"
edition = "2024"

[dependencies]
may-i-sexpr = { path = "../sexpr" }
may-i-core = { path = "../core" }
dirs = "6"
glob = "0.3"
miette = { version = "7", features = ["fancy"] }
regex = "1"
thiserror = "2"

[dev-dependencies]
may-i-engine = { path = "../engine" }
may-i-core = { path = "../core", features = ["test-generators"] }
may-i-sexpr = { path = "../sexpr", features = ["test-generators"] }
proptest = "1"
temp-env = "0.3"
tempfile = "3"
