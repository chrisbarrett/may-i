[package]
name = "may-i-output"
version = "0.1.0"
edition = "2024"

[dependencies]
may-i-core = { path = "../core" }
may-i-pp = { path = "../pp" }
may-i-sexpr = { path = "../sexpr" }
colored = "3.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
minus = { version = "5.3.1", features = ["static_output"] }

[dev-dependencies]
may-i-core = { path = "../core" }