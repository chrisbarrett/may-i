[workspace]
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
# CstNode is recursive via ShapeF<Box<CstNode>>, so Vec<Box<CstNode>>
# is the natural carrier shape — items flow into ShapeF without re-boxing.
vec_box = "allow"
# Test fixtures and proptest strategies use tuple types that triple-nest
# generic types; factoring into named aliases adds noise without clarity.
type_complexity = "allow"

[lints]
workspace = true

[package]
name = "may-i"
version = "0.3.0"
edition = "2024"

[dependencies]
may-i-shell-parser = { path = "crates/shell-parser" }
may-i-core = { path = "crates/core" }
may-i-engine = { path = "crates/engine" }
may-i-config = { path = "crates/config" }
may-i-output = { path = "crates/may-i-output" }
may-i-pp = { path = "crates/pp" }
may-i-sexpr = { path = "crates/sexpr" }
clap = { version = "4", features = ["derive"] }
colored = "3.1.1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
console = "0.15"
dialoguer = "0.11"
similar = "2"
termimad = "0.34.1"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
may-i-engine = { path = "crates/engine", features = ["test-generators"] }
predicates = "3"
proptest = "1"
serde = { version = "1", features = ["derive"] }
temp-env = "0.3"
tempfile = "3"
terminal_size = "0.4"
toml = "0.8"
