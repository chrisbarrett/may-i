#:schema https://json.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  # Pre-commit hooks (fast - only affected packages)
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "cargo-clippy-affected",
    name = "cargo clippy (affected)",
    entry = "cargo affected --verbose --staged clippy -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "cargo-test-affected",
    name = "cargo test (affected)",
    entry = "cargo affected --staged test",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "output-sink-boundary",
    name = "output sink boundary (no stdout/stderr handles outside the sink)",
    entry = "scripts/check-output-sink-boundary.sh",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "openspec-validate",
    name = "openspec validate",
    entry = "openspec validate --all --strict --no-interactive",
    language = "system",
    files = "^openspec/",
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "validate-spec-frontmatter",
    name = "validate spec frontmatter",
    entry = "scripts/validate-spec-frontmatter.sh",
    language = "system",
    files = "^openspec/specs/",
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "validate-change-doc-sync",
    name = "validate change doc-sync (REFERENCE.md gate)",
    entry = "scripts/validate-change-doc-sync.sh",
    language = "system",
    files = "^openspec/changes/",
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "validate-archive-complete",
    name = "validate archive completeness (no unchecked tasks)",
    entry = "scripts/validate-archive-complete.sh",
    language = "system",
    files = "^openspec/changes/",
    pass_filenames = false,
    stages = ["pre-commit"],
  },

  # Pre-push hooks (full verification). No build hooks: clippy runs the
  # same compiler checks, and test forces full codegen anyway.
  {
    id = "cargo-clippy-full",
    name = "cargo clippy (full)",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-push"],
  },
  {
    id = "cargo-test-full",
    name = "cargo test (full)",
    entry = "cargo test --workspace",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-push"],
  },
]
