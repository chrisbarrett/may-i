[[repos]]
repo = "local"
hooks = [
  # Pre-commit hooks (fast - only affected packages)
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "cargo-build-affected",
    name = "cargo build (affected)",
    entry = "env RUSTFLAGS='-D warnings' cargo affected --staged build",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "cargo-clippy-affected",
    name = "cargo clippy (affected)",
    entry = "cargo affected --verbose --staged clippy -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "cargo-test-affected",
    name = "cargo test (affected)",
    entry = "cargo affected --staged test",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "openspec-validate",
    name = "openspec validate",
    entry = "openspec validate --all --strict --no-interactive",
    language = "system",
    files = "^openspec/",
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "validate-spec-frontmatter",
    name = "validate spec frontmatter",
    entry = "scripts/validate-spec-frontmatter.sh",
    language = "system",
    files = "^openspec/specs/",
    pass_filenames = false,
    stages = ["pre-commit"],
  },

  # Pre-push hooks (full verification)
  {
    id = "cargo-build-full",
    name = "cargo build (full)",
    entry = "env RUSTFLAGS='-D warnings' cargo build --workspace",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-push"],
  },
  {
    id = "cargo-clippy-full",
    name = "cargo clippy (full)",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-push"],
  },
  {
    id = "cargo-test-full",
    name = "cargo test (full)",
    entry = "cargo test --workspace",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-push"],
  },
  {
    id = "nix-build",
    name = "nix build",
    entry = "nix build .#default --no-link",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"],
  },
]
